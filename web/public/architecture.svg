<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="800">VayuNetra — signal to city action in minutes</text>
  <text x="640" y="66" text-anchor="middle" fill="#64748b" font-size="14">Every box decouples through two seams: the Supabase schema and the API contract. Spatial unit everywhere: Uber H3 res-8 (~1 km hexagons).</text>

  <!-- ============ Column 1: DATA ============ -->
  <rect x="30" y="96" width="220" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="124" text-anchor="middle" fill="#0284c7" font-size="16" font-weight="800">DATA (free + open)</text>
  <g fill="#475569" font-size="13">
    <rect x="46" y="140" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="159" text-anchor="middle" fill="#0f172a" font-weight="700">CAAQMS ground grid</text>
    <text x="140" y="177" text-anchor="middle">CPCB via OpenAQ · 6 pollutants</text>
    <rect x="46" y="196" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="215" text-anchor="middle" fill="#0f172a" font-weight="700">Weather + boundary layer</text>
    <text x="140" y="233" text-anchor="middle">Open-Meteo · ERA5 archive</text>
    <rect x="46" y="252" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="271" text-anchor="middle" fill="#0f172a" font-weight="700">Satellites (Earth Engine)</text>
    <text x="140" y="289" text-anchor="middle">Sentinel-5P NO₂ · S2 · FIRMS</text>
    <rect x="46" y="308" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="327" text-anchor="middle" fill="#0f172a" font-weight="700">Emission-source registry</text>
    <text x="140" y="345" text-anchor="middle">OSM + satellite-detected (E1)</text>
    <rect x="46" y="364" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="383" text-anchor="middle" fill="#0f172a" font-weight="700">Population + vulnerability</text>
    <text x="140" y="401" text-anchor="middle">GPW v4.11 · OSM hospitals/schools</text>
    <rect x="46" y="420" width="188" height="48" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="140" y="439" text-anchor="middle" fill="#0f172a" font-weight="700">Mobility proxy</text>
    <text x="140" y="457" text-anchor="middle">GTFS + road-network time-of-day</text>
    <text x="140" y="510" text-anchor="middle" fill="#64748b" font-size="12">hourly + daily ingest crons</text>
    <text x="140" y="528" text-anchor="middle" fill="#64748b" font-size="12">(GitHub Actions, keyless where possible)</text>
  </g>

  <!-- ============ Column 2: SPINE ============ -->
  <rect x="290" y="96" width="200" height="470" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
  <text x="390" y="124" text-anchor="middle" fill="#059669" font-size="16" font-weight="800">SEAM #1 · SCHEMA</text>
  <g fill="#475569" font-size="13">
    <text x="390" y="152" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">Supabase Postgres</text>
    <text x="390" y="170" text-anchor="middle" fill="#64748b" font-size="12">PostGIS · pgvector · RLS</text>
    <rect x="306" y="184" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="203" text-anchor="middle">measurements</text>
    <rect x="306" y="218" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="237" text-anchor="middle">attribution</text>
    <rect x="306" y="252" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="271" text-anchor="middle">forecasts</text>
    <rect x="306" y="286" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="305" text-anchor="middle">emission_sources</text>
    <rect x="306" y="320" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="339" text-anchor="middle">enforcement_recs</text>
    <rect x="306" y="354" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="373" text-anchor="middle">advisories · subscribers</text>
    <rect x="306" y="388" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="407" text-anchor="middle">vulnerability zones</text>
    <rect x="306" y="422" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="441" text-anchor="middle">kb_chunks (text+image)</text>
    <rect x="306" y="456" width="168" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="390" y="475" text-anchor="middle">action_traces</text>
    <text x="390" y="512" text-anchor="middle" fill="#64748b" font-size="12">models WRITE rows, API READS rows —</text>
    <text x="390" y="530" text-anchor="middle" fill="#64748b" font-size="12">no one calls a teammate directly</text>
  </g>

