    <text x="1160" y="366" text-anchor="middle">clean-air zones</text>
    <text x="1160" y="384" text-anchor="middle">en · hi · kn · mr</text>
    <rect x="1084" y="408" width="152" height="86" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1160" y="428" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Officer artefacts</text>
    <text x="1160" y="448" text-anchor="middle">Sentinel-2 evidence</text>
    <text x="1160" y="466" text-anchor="middle">cited Notice PDF</text>
