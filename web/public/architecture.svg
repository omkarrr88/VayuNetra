  <!-- ============ Footer strip ============ -->
  <rect x="30" y="592" width="1220" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="622" text-anchor="middle" fill="#0284c7" font-size="14" font-weight="800">OPERATIONS — 100% free tier, ₹0</text>
  <text x="640" y="646" text-anchor="middle" fill="#475569" font-size="13">GitHub Actions: hourly ingest · daily model + registry + advisory refresh · enforcement regenerates unconditionally · keep-alive pings — signal to cited action in seconds, not days</text>
  <text x="640" y="670" text-anchor="middle" fill="#64748b" font-size="12">New city = one YAML config (bbox, languages) or one POST /admin/cities call — every layer above is city-agnostic</text>
</svg>
