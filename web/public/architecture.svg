    <rect x="700" y="286" width="140" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="770" y="307" text-anchor="middle" fill="#0f172a" font-weight="700">A4 Advisory</text>
    <text x="770" y="325" text-anchor="middle" font-size="12">4-lang · vuln-aware</text>
    <rect x="550" y="348" width="290" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="695" y="368" text-anchor="middle" fill="#0f172a" font-weight="700">A5 Multi-City — cross-city playbooks</text>
    <text x="695" y="402" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700">SUPPORTING MODELS</text>
    <rect x="550" y="412" width="290" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="695" y="431" text-anchor="middle" font-size="12">E1 satellite detection · E2 dense 1 km field</text>
    <text x="695" y="449" text-anchor="middle" font-size="12">E3 what-if counterfactual · E5 optimiser</text>
    <text x="695" y="467" text-anchor="middle" font-size="12">E7 health ₹ / lives / CO₂e · fairness audit</text>
    <text x="695" y="485" text-anchor="middle" font-size="12">GRAP forecast-trigger · clean-air zones</text>
    <text x="695" y="503" text-anchor="middle" font-size="12">RAG over NCAP / GRAP / CPCB corpus</text>
    <text x="695" y="536" text-anchor="middle" fill="#64748b" font-size="12">every claim cited, gated, or labeled heuristic</text>
  </g>

  <!-- ============ Column 4: API ============ -->
  <rect x="900" y="96" width="130" height="470" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
  <text x="965" y="124" text-anchor="middle" fill="#059669" font-size="15" font-weight="800">SEAM #2 · API</text>
  <g fill="#475569" font-size="12">
    <text x="965" y="152" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">FastAPI</text>
    <text x="965" y="170" text-anchor="middle" fill="#64748b">Render · ₹0</text>
    <text x="965" y="200" text-anchor="middle">one envelope:</text>
    <text x="965" y="218" text-anchor="middle" fill="#0f172a">{success, data,</text>
    <text x="965" y="236" text-anchor="middle" fill="#0f172a">error, meta}</text>
    <text x="965" y="270" text-anchor="middle">34 endpoints + WS</text>
    <text x="965" y="288" text-anchor="middle">WebSocket /live</text>
    <text x="965" y="306" text-anchor="middle">Notice PDF</text>
    <text x="965" y="324" text-anchor="middle">/simulate · /optimize · /plume</text>
    <text x="965" y="342" text-anchor="middle">/clean-zones · /interventions</text>
    <text x="965" y="360" text-anchor="middle">/admin/cities</text>
    <text x="965" y="394" text-anchor="middle" fill="#64748b">RLS + anon JWT</text>
    <text x="965" y="412" text-anchor="middle" fill="#64748b">service-role only</text>
    <text x="965" y="430" text-anchor="middle" fill="#64748b">server-side</text>
    <text x="965" y="464" text-anchor="middle" fill="#b45309">DEMO_MODE:</text>
    <text x="965" y="482" text-anchor="middle" fill="#b45309">full flow offline</text>
    <text x="965" y="500" text-anchor="middle" fill="#b45309">from fixtures</text>
  </g>

