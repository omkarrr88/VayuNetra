# =====================================================================
# City onboarding config — Delhi.  Adding a city = drop a file like this.
# This IS the scalability story (ARCHITECTURE.md §18, §20). No per-city code.
# =====================================================================
city_id: delhi
name: Delhi
state: DL

# bbox as [min_lng, min_lat, max_lng, max_lat] (EPSG:4326)
bbox: [76.84, 28.40, 77.35, 28.88]
center: [77.21, 28.61]

# Showcase languages for this city (citizen advisory)
languages: [hi, en]

# H3 resolution for hyperlocal cells (res 8 ≈ ~1 km). Global default.
h3_res: 8

# Optional pin-list of specific CPCB CAAQMS station ids (data.gov.in).
# Ingestion discovers stations by bbox, so this stays empty unless a city
# needs to restrict ingest to a vetted subset.
caaqms_station_ids: []

# Path/ref to ward boundary GeoJSON (Storage/R2 or repo data/)
ward_geojson_ref: "data/wards/delhi.geojson"

# Which instruments legally bind here. GRAP/CAQM are statutory in Delhi-NCR
# only — enforcement citations outside NCR must not lean on them.
regulatory:
  authority: "Delhi Pollution Control Committee (DPCC) · CAQM"
  grap_applies: true

active: true
