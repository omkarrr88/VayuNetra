name: ingest (data refresh)

# Data-pipeline crons (ARCHITECTURE.md §7.4). Owner: Abhinav.
# GitHub Actions only runs workflows from .github/workflows/ (infra/workflows/ is the doc home).
# Public repo -> unlimited free minutes.
on:
  schedule:
    - cron: "5 * * * *"     # hourly: ground + weather ingest
    - cron: "30 1 * * *"    # 01:30 UTC daily: forecast rollup + enforcement run
  workflow_dispatch:

jobs:
  ingest-ground-weather:
    name: Ingest ground + weather measurements
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ingest ground + weather → measurements
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        # --push is what actually persists rows — without it this job fetches
        # summaries and discards them (measurements went stale for 3 days).
        run: |
          # --days 1 --max-sensors 15: OpenAQ rate-limits shared Actions IPs; keep
          # each run small. ::warning:: makes failures visible in the run summary
          # instead of being swallowed (openaq sat silently stale for a week).
          CITIES=$(python -c "from core.cities import list_city_ids; print(' '.join(list_city_ids()))")
          for c in $CITIES; do
            python -m connectors.openaq --city $c --days 1 --max-sensors 15 --push || echo "::warning::openaq $c failed"
            sleep 20
          done
          # Direct CAAQMS path: data.gov.in is unreachable from some ISP routes but
          # may work from Actions IPs; auto-heals whenever the route is clear.
          # (Redundancy only — our OpenAQ stations are already provider=CPCB/CAAQMS.)
          python -m connectors.cpcb --city delhi --push || echo "::warning::cpcb direct path unreachable"
          for c in $CITIES; do
            python -m connectors.openmeteo --city $c --push || true
          done
      - name: Keep-alive ping (prevents Supabase project pause)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          import os, sys
          try:
              from core.supa import client
              db = client()
              db.table('cities').select('city_id').limit(1).execute()
              print('Keep-alive ping sent.')
          except Exception as e:
              print(f'Keep-alive skipped (demo/no creds): {e}')
          " || true

  forecast-enforcement-rollup:
    name: Daily forecast + enforcement run
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ingest RAG corpus
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m rag.ingest
      - name: Refresh emission-source registry from OSM (auto add/remove sites)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Clears only OSM-referencing enforcement_recs (FK) — fully regenerated
        # by the dedicated step below. "|| true": Overpass flakiness must not
        # kill the daily run.
        run: |
          CITIES=$(python -c "from core.cities import list_city_ids; print(' '.join(list_city_ids()))")
          for c in $CITIES; do
            python -m connectors.osm_sources --city $c --push || true
            sleep 20
          done
      - name: Refresh forecasts + attribution (model outputs must track the data)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CITIES=$(python -c "from core.cities import list_city_ids; print(' '.join(list_city_ids()))")
          for c in $CITIES; do
            python -m ml.forecast.train --city $c --write || true
            python -m ml.attribution.attribute --city $c --write || true
          done
      - name: Run multi-agent enforcement pipeline for all cities
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
        run: |
          python -c "
          from agents.graph import run_query
          from core.cities import list_city_ids
          for city in list_city_ids():
              state = run_query(city_id=city, query='daily scheduled pipeline')
              print(f'{city}: {len(state.get(\"enforcement\") or [])} enforcement recs, latency={state.get(\"latency_ms\", 0)}ms')
          "
      # The graph's spike gate may legitimately skip the enforcement node on a
      # calm day — but the OSM step above cleared recs, so regeneration must be
      # UNCONDITIONAL or the live worklist ends up empty (it did on 2026-07-19).
      - name: Regenerate enforcement recs (always — the worklist must never be empty)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from agents.enforcement import run_enforcement
          from core.cities import list_city_ids
          for city in list_city_ids():
              recs = run_enforcement(city, write_to_db=True)
              print(f'{city}: {len(recs)} enforcement recs regenerated')
          "
      - name: Refresh citizen advisories from the new forecasts
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
        run: python scripts/refresh_advisories.py || true
      - name: Retention — dedup weather rows + prune beyond 90 days (free-tier headroom)
        env:
          DEMO_MODE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/prune_measurements.py --days 90 --dedup-weather || true
