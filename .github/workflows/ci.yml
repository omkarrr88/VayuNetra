name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check . --output-format=github || true
      - name: Test (DEMO_MODE) + coverage gate
        env:
          DEMO_MODE: "true"
          LOG_LEVEL: "warning"
        run: >
          pytest tests/ -q
          --cov=api --cov=agents --cov=ml --cov=core --cov=rag
          --cov-report=term-missing --cov-fail-under=55

  api-smoke:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Install
        run: pip install -r requirements.txt
      - name: Start API + smoke test
        env:
          DEMO_MODE: "true"
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -sf http://localhost:8000/health
          curl -sf "http://localhost:8000/cities"
          curl -sf "http://localhost:8000/enforcement?city=delhi"
          curl -sf -X POST http://localhost:8000/agent/query \
            -H "Content-Type: application/json" \
            -d '{"city": "delhi", "query": "top enforcement priorities"}'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install & build
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_DEMO_MODE: "true"
        run: |
          npm install
          npm run build

  e2e:
    # Smoke journey in the browser against the bundled fixtures (no live API needed).
    # The 9-flow live officer journey (VN_LIVE=1) runs locally against a live backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install web deps + Chromium
        working-directory: web
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Playwright smoke (7 flows, offline fixtures)
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_DEMO_MODE: "true"
        run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
