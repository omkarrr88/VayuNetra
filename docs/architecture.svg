<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="640" y="42" text-anchor="middle" fill="#f9fafb" font-size="26" font-weight="800">VayuNetra — signal to city action in minutes</text>
  <text x="640" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">Every box decouples through two seams: the Supabase schema and the API contract. Spatial unit everywhere: Uber H3 res-8 (~1 km hexagons).</text>

  <!-- ============ Column 1: DATA ============ -->
  <rect x="30" y="96" width="220" height="470" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="140" y="124" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">DATA (free + open)</text>
  <g fill="#d1d5db" font-size="13">
    <rect x="46" y="140" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="161" text-anchor="middle" fill="#f9fafb" font-weight="700">CAAQMS ground grid</text>
    <text x="140" y="179" text-anchor="middle">CPCB via OpenAQ · 6 pollutants</text>
    <rect x="46" y="200" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="221" text-anchor="middle" fill="#f9fafb" font-weight="700">Weather + boundary layer</text>
    <text x="140" y="239" text-anchor="middle">Open-Meteo · ERA5 archive</text>
    <rect x="46" y="260" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="281" text-anchor="middle" fill="#f9fafb" font-weight="700">Satellites (Earth Engine)</text>
    <text x="140" y="299" text-anchor="middle">Sentinel-5P NO₂ · S2 · FIRMS</text>
    <rect x="46" y="320" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="341" text-anchor="middle" fill="#f9fafb" font-weight="700">Emission-source registry</text>
    <text x="140" y="359" text-anchor="middle">OSM + satellite-detected (E1)</text>
    <rect x="46" y="380" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="401" text-anchor="middle" fill="#f9fafb" font-weight="700">Population + vulnerability</text>
    <text x="140" y="419" text-anchor="middle">GPW v4.11 · OSM hospitals/schools</text>
    <rect x="46" y="440" width="188" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="140" y="461" text-anchor="middle" fill="#f9fafb" font-weight="700">Mobility proxy</text>
    <text x="140" y="479" text-anchor="middle">GTFS + road-network time-of-day</text>
    <text x="140" y="530" text-anchor="middle" fill="#94a3b8" font-size="12">hourly + daily ingest crons</text>
    <text x="140" y="548" text-anchor="middle" fill="#94a3b8" font-size="12">(GitHub Actions, keyless where possible)</text>
  </g>

  <!-- ============ Column 2: SPINE ============ -->
  <rect x="290" y="96" width="200" height="470" rx="10" fill="#1f2937" stroke="#86efac" stroke-width="2"/>
  <text x="390" y="124" text-anchor="middle" fill="#86efac" font-size="16" font-weight="800">SEAM #1 · SCHEMA</text>
  <g fill="#d1d5db" font-size="13">
    <text x="390" y="152" text-anchor="middle" fill="#f9fafb" font-size="15" font-weight="700">Supabase Postgres</text>
    <text x="390" y="170" text-anchor="middle" fill="#94a3b8" font-size="12">PostGIS · pgvector · RLS</text>
    <rect x="306" y="186" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="206" text-anchor="middle">measurements</text>
    <rect x="306" y="222" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="242" text-anchor="middle">attribution</text>
    <rect x="306" y="258" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="278" text-anchor="middle">forecasts</text>
    <rect x="306" y="294" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="314" text-anchor="middle">emission_sources</text>
    <rect x="306" y="330" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="350" text-anchor="middle">enforcement_recs</text>
    <rect x="306" y="366" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="386" text-anchor="middle">advisories · subscribers</text>
    <rect x="306" y="402" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="422" text-anchor="middle">kb_chunks (text+image)</text>
    <rect x="306" y="438" width="168" height="30" rx="6" fill="#111827" stroke="#334155"/><text x="390" y="458" text-anchor="middle">action_traces</text>
    <text x="390" y="500" text-anchor="middle" fill="#94a3b8" font-size="12">models WRITE rows,</text>
    <text x="390" y="518" text-anchor="middle" fill="#94a3b8" font-size="12">API READS rows —</text>
    <text x="390" y="536" text-anchor="middle" fill="#94a3b8" font-size="12">no one calls a teammate directly</text>
  </g>

  <!-- ============ Column 3: AGENTS ============ -->
  <rect x="530" y="96" width="330" height="470" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="695" y="124" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">AGENT GRAPH (LangGraph)</text>
  <g fill="#d1d5db" font-size="13">
    <rect x="550" y="140" width="290" height="34" rx="6" fill="#111827" stroke="#38bdf8"/>
    <text x="695" y="162" text-anchor="middle" fill="#f9fafb" font-weight="700">A0 Orchestrator · per-node latency traces</text>
    <rect x="550" y="184" width="140" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="620" y="205" text-anchor="middle" fill="#f9fafb" font-weight="700">A1 Attribution</text>
    <text x="620" y="223" text-anchor="middle" font-size="12">GBM + SHAP hybrid</text>
    <rect x="700" y="184" width="140" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="770" y="205" text-anchor="middle" fill="#f9fafb" font-weight="700">A2 Forecast</text>
    <text x="770" y="223" text-anchor="middle" font-size="12">quantile + CQR calib.</text>
    <rect x="550" y="246" width="290" height="30" rx="6" fill="#111827" stroke="#f59e0b"/>
    <text x="695" y="266" text-anchor="middle" fill="#fbbf24" font-weight="700">spike gate (anomaly check on the forecast)</text>
    <rect x="550" y="286" width="140" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="620" y="307" text-anchor="middle" fill="#f9fafb" font-weight="700">A3 Enforcement</text>
    <text x="620" y="325" text-anchor="middle" font-size="12">RAG-cited worklist</text>
    <rect x="700" y="286" width="140" height="52" rx="6" fill="#111827" stroke="#334155"/>
    <text x="770" y="307" text-anchor="middle" fill="#f9fafb" font-weight="700">A4 Advisory</text>
    <text x="770" y="325" text-anchor="middle" font-size="12">4-lang · vuln-aware</text>
    <rect x="550" y="348" width="290" height="30" rx="6" fill="#111827" stroke="#334155"/>
    <text x="695" y="368" text-anchor="middle" fill="#f9fafb" font-weight="700">A5 Multi-City — cross-city playbooks</text>
    <text x="695" y="404" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">SUPPORTING MODELS</text>
    <rect x="550" y="414" width="290" height="94" rx="6" fill="#111827" stroke="#334155"/>
    <text x="695" y="434" text-anchor="middle" font-size="12">E1 satellite CV (U-Net) · E2 dense 1 km field</text>
    <text x="695" y="452" text-anchor="middle" font-size="12">E3 what-if counterfactual · E5 optimiser</text>
    <text x="695" y="470" text-anchor="middle" font-size="12">E7 ₹/lives/CO₂e · fairness · GRAP trigger</text>
    <text x="695" y="488" text-anchor="middle" font-size="12">clean-air zones · RAG over NCAP/GRAP/CPCB</text>
    <text x="695" y="536" text-anchor="middle" fill="#94a3b8" font-size="12">every claim cited, gated, or labeled heuristic</text>
  </g>

  <!-- ============ Column 4: API ============ -->
  <rect x="900" y="96" width="130" height="470" rx="10" fill="#1f2937" stroke="#86efac" stroke-width="2"/>
  <text x="965" y="124" text-anchor="middle" fill="#86efac" font-size="15" font-weight="800">SEAM #2 · API</text>
  <g fill="#d1d5db" font-size="12">
    <text x="965" y="152" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">FastAPI</text>
    <text x="965" y="170" text-anchor="middle" fill="#94a3b8">Render · ₹0</text>
    <text x="965" y="200" text-anchor="middle">one envelope:</text>
    <text x="965" y="218" text-anchor="middle" fill="#f9fafb">{success, data,</text>
    <text x="965" y="236" text-anchor="middle" fill="#f9fafb">error, meta}</text>
    <text x="965" y="272" text-anchor="middle">34 endpoints + WS</text>
    <text x="965" y="290" text-anchor="middle">WebSocket /live</text>
    <text x="965" y="308" text-anchor="middle">Notice PDF</text>
    <text x="965" y="326" text-anchor="middle">/simulate · /optimize · /plume</text>
    <text x="965" y="344" text-anchor="middle">/admin/cities</text>
    <text x="965" y="380" text-anchor="middle" fill="#94a3b8">RLS + anon JWT</text>
    <text x="965" y="398" text-anchor="middle" fill="#94a3b8">service-role only</text>
    <text x="965" y="416" text-anchor="middle" fill="#94a3b8">server-side</text>
    <text x="965" y="452" text-anchor="middle" fill="#fbbf24">DEMO_MODE:</text>
    <text x="965" y="470" text-anchor="middle" fill="#fbbf24">full flow offline</text>
    <text x="965" y="488" text-anchor="middle" fill="#fbbf24">from fixtures</text>
  </g>

  <!-- ============ Column 5: EXPERIENCE ============ -->
  <rect x="1070" y="96" width="180" height="470" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="1160" y="124" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800">EXPERIENCE</text>
  <g fill="#d1d5db" font-size="12">
    <rect x="1084" y="140" width="152" height="120" rx="6" fill="#111827" stroke="#334155"/>
    <text x="1160" y="160" text-anchor="middle" fill="#f9fafb" font-size="13" font-weight="700">Ops console (Vercel)</text>
    <text x="1160" y="180" text-anchor="middle">blame map · plumes · wards · freight</text>
    <text x="1160" y="198" text-anchor="middle">worklist + dossier · forecast</text>
    <text x="1160" y="216" text-anchor="middle">what-if + optimiser</text>
    <text x="1160" y="234" text-anchor="middle">ROI · agent trace</text>
    <text x="1160" y="252" text-anchor="middle">10-city switcher</text>
    <rect x="1084" y="272" width="152" height="104" rx="6" fill="#111827" stroke="#334155"/>
    <text x="1160" y="292" text-anchor="middle" fill="#f9fafb" font-size="13" font-weight="700">Citizen channels</text>
    <text x="1160" y="312" text-anchor="middle">PWA · Telegram bot</text>
    <text x="1160" y="330" text-anchor="middle">IVR in+out calls</text>
    <text x="1160" y="348" text-anchor="middle">public display mode</text>
    <text x="1160" y="366" text-anchor="middle">en · hi · kn · mr</text>
    <rect x="1084" y="392" width="152" height="86" rx="6" fill="#111827" stroke="#334155"/>
    <text x="1160" y="412" text-anchor="middle" fill="#f9fafb" font-size="13" font-weight="700">Officer artefacts</text>
    <text x="1160" y="432" text-anchor="middle">evidence dossier</text>
    <text x="1160" y="450" text-anchor="middle">cited Notice PDF</text>
    <text x="1160" y="468" text-anchor="middle">audit status trail</text>
  </g>

  <!-- ============ Arrows ============ -->
  <line x1="252" y1="330" x2="288" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="492" y1="260" x2="528" y2="260" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="528" y1="400" x2="492" y2="400" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="510" y="248" text-anchor="middle" fill="#94a3b8" font-size="11">read</text>
  <text x="510" y="420" text-anchor="middle" fill="#94a3b8" font-size="11">write</text>
  <line x1="862" y1="330" x2="898" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1032" y1="330" x2="1068" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ============ Footer strip ============ -->
  <rect x="30" y="592" width="1220" height="94" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="640" y="622" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">OPERATIONS — 100% free tier, ₹0</text>
  <text x="640" y="646" text-anchor="middle" fill="#d1d5db" font-size="13">GitHub Actions: hourly ingest · daily model + registry + advisory refresh · keep-alive pings — signal to cited action measured live in seconds, not days</text>
  <text x="640" y="670" text-anchor="middle" fill="#94a3b8" font-size="12">New city = one YAML config (bbox, languages) or one POST /admin/cities call — every layer above is city-agnostic</text>
</svg>
